<style>
:root {
  --ink: #0d2238; --muted: #4d6781; --card: #ffffff; --line: #d6e4ee; --soft: #eef5fa;
  --bg1: #cfe9f6; --bg2: #f1f9fd; --sky: #27b5f2; --sky-d: #1a8fc4; --coral: #ff6a3d; --sun: #ffc93c; --mint: #2fbf86;
  --shadow: 0 2px 4px rgba(13,34,56,.06), 0 14px 40px rgba(13,34,56,.12);
  --font: 'Jua', 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ink: #eaf4fb; --muted: #9db6c9; --card: #16304b; --line: #284c6b; --soft: #1d3b5a;
    --bg1: #0a1a2b; --bg2: #11283f; --sky: #4cc3f6; --sky-d: #27b5f2; --coral: #ff8a63;
    --shadow: 0 2px 4px rgba(0,0,0,.3), 0 14px 40px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; }
body { font-family: var(--font); color: var(--ink); background: linear-gradient(180deg, var(--bg1), var(--bg2) 55%) fixed; min-height: 100svh; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; border-radius: 8px; }

/* ---------- 메뉴 ---------- */
.wrap { max-width: 1060px; margin: 0 auto; padding: 22px 20px 56px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.logo { display: inline-flex; align-items: center; gap: 10px; font-size: 24px; text-decoration: none; }
.ball { width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #f1ff7a, #d8f23a 55%, #a9c21b); position: relative; overflow: hidden; box-shadow: inset -2px -3px 0 rgba(0,0,0,.08); }
.ball::before, .ball::after { content: ''; position: absolute; top: 12%; bottom: 12%; width: 120%; border: 2.5px solid #fff; border-radius: 50%; }
.ball::before { left: -78%; } .ball::after { right: -78%; }
.toplink { font-size: 15px; color: var(--muted); text-decoration: none; padding: 8px 14px; border-radius: 999px; background: color-mix(in srgb, var(--card) 70%, transparent); border: 1px solid var(--line); }
.toplink:hover { color: var(--ink); background: var(--card); }
.hero { margin: 34px 0 26px; }
.hero h1 { margin: 0; font-size: clamp(34px, 6vw, 56px); line-height: 1.1; letter-spacing: -.01em; }
.hero p { margin: 10px 0 0; font-size: clamp(16px, 2.2vw, 20px); color: var(--muted); }

.stage { display: grid; grid-template-columns: minmax(250px, 320px) 1fr; gap: 24px; align-items: start; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.item { width: 100%; display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 14px; padding: 14px 16px; text-align: left; background: var(--card); border: 3px solid transparent; border-radius: 22px; box-shadow: var(--shadow); transition: transform .14s, border-color .14s, background .14s; }
.item:hover { transform: translateX(3px); }
.item[aria-pressed="true"] { border-color: var(--sky); background: color-mix(in srgb, var(--sky) 10%, var(--card)); transform: translateX(6px); }
.item .em { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; font-size: 30px; background: var(--soft); }
.item[aria-pressed="true"] .em { background: var(--sky); }
.item b { display: block; font-weight: 400; font-size: 21px; }
.item small { display: block; margin-top: 2px; font-size: 14px; color: var(--muted); }
.item .go { font-size: 22px; color: var(--muted); opacity: 0; transition: opacity .14s; }
.item[aria-pressed="true"] .go { opacity: 1; color: var(--sky-d); }
.soon { padding: 14px 18px; border-radius: 18px; border: 2px dashed var(--line); color: var(--muted); font-size: 15px; text-align: center; }

.detail { background: var(--card); border-radius: 28px; box-shadow: var(--shadow); overflow: hidden; animation: pop .28s ease both; }
@keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.art { aspect-ratio: 400 / 240; background: var(--soft); }
.art svg { display: block; width: 100%; height: 100%; }
.dbody { padding: 22px 26px 26px; }
.dbody h2 { margin: 0; font-size: 32px; font-weight: 400; }
.tagline { margin: 4px 0 0; font-size: 18px; color: var(--sky-d); }
.blurb { margin: 14px 0 0; font-size: 17px; line-height: 1.6; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; margin: 16px 0 0; padding: 0; }
.chips li { padding: 6px 13px; border-radius: 999px; background: var(--soft); font-size: 15px; }
.chips li.pl { background: color-mix(in srgb, var(--sun) 35%, var(--card)); }
.how { margin: 18px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.how li { position: relative; padding-left: 26px; font-size: 16px; line-height: 1.5; }
.how li::before { content: ''; position: absolute; left: 4px; top: .5em; width: 10px; height: 10px; border-radius: 50%; background: var(--coral); }
.actions { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; padding: 0 26px; border-radius: 999px; font-size: 20px; text-decoration: none; background: var(--soft); transition: transform .12s, background .12s; }
.btn:hover { transform: translateY(-2px); }
.btn.primary { background: var(--sky); color: #fff; box-shadow: 0 6px 0 var(--sky-d); font-size: 22px; padding: 0 34px; min-height: 60px; }
.btn.primary:hover { background: color-mix(in srgb, var(--sky) 88%, #fff); }
.btn.primary:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--sky-d); }
.minor { font-size: 15px; color: var(--muted); }
.foot { margin-top: 38px; padding-top: 20px; border-top: 2px dashed var(--line); font-size: 14px; color: var(--muted); line-height: 1.7; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.foot a { color: var(--muted); }

/* ---------- 플레이 화면 ---------- */
#player { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; background: #0d2238; }
.bar { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 12px; background: #0d2238; color: #fff; }
.bar .back { height: 38px; padding: 0 16px; border-radius: 999px; background: var(--sky); font-size: 17px; display: inline-flex; align-items: center; gap: 6px; }
.bar .back:hover { background: #3cc1fa; }
.bar .ttl { font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .sp { flex: 1; }
.bar .tool { height: 38px; padding: 0 14px; border-radius: 999px; background: rgba(255,255,255,.12); font-size: 15px; display: inline-flex; align-items: center; text-decoration: none; color: #fff; white-space: nowrap; }
.bar .tool:hover { background: rgba(255,255,255,.22); }
.frame { position: relative; flex: 1 1 auto; min-height: 0; background: #0d2238; }
.frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
.loading { position: absolute; inset: 0; display: grid; place-content: center; gap: 14px; text-align: center; color: #fff; font-size: 20px; background: #0d2238; transition: opacity .25s; }
.loading.done { opacity: 0; pointer-events: none; }
.spin { width: 46px; height: 46px; margin: 0 auto; border-radius: 50%; border: 5px solid rgba(255,255,255,.2); border-top-color: var(--sun); animation: sp .9s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
.loading .hint { font-size: 15px; opacity: 0; transition: opacity .4s; color: #b9cde0; }
.loading .hint.show { opacity: 1; }
.loading .hint a { color: var(--sun); }

@media (max-width: 820px) {
  .stage { grid-template-columns: 1fr; }
  .list { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 10px; }
  .item { grid-template-columns: 1fr; justify-items: center; text-align: center; padding: 12px 6px 10px; gap: 6px; border-radius: 18px; box-shadow: 0 2px 4px rgba(13,34,56,.06), 0 6px 16px rgba(13,34,56,.1); }
  .item .em { width: 46px; height: 46px; font-size: 26px; border-radius: 14px; }
  .item b { font-size: 16px; white-space: nowrap; } .item small, .item .go { display: none; }
  .item:hover, .item[aria-pressed="true"] { transform: none; }
  .soon { display: none; }
  .dbody { padding: 18px 18px 22px; }
  .dbody h2 { font-size: 27px; }
  .bar .tool.hide-s { display: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<script>
'use strict';
/* ===== 게임 목록: 게임을 더 넣으려면 아래 배열에 객체 하나만 추가하면 된다 ===== */
const BASE = 'https://sunlitkoreakorea.github.io/';
const GAMES = [
  {

    inputs: ['🖱️ 마우스', '👆 터치', '⌨️ 키보드', '📷 웹캠 손동작'], players: '1~4명',
    how: ['공을 옆으로 끌어 위치를 정하고, 아래로 당겼다 놓으면 발사돼요.', 'Wii식 스윙: 누른 채 아래로 당겼다가 위로 휙. 옆으로 휘면 스핀이 걸려요.', '키보드: ← → 위치, 스페이스를 길게 눌러 세기.'],
    url: BASE + 'dorm-bowling/', repo: 'https://github.com/Sunlitkoreakorea/dorm-bowling', art: artBowling,
  },
  {
    id: 'dorm-darts', emoji: '🎯', name: '기숙사 다트', sub: '301 · 501 · 크리켓 · 1~4명',
    tagline: '301·501·크리켓·카운트업 3D 다트',
    blurb: '흔들리는 조준점이 안정될 때 놓아서 던져요. 더블 아웃 옵션과 마무리 경로 추천, 난이도 3단계가 있어요.',
    inputs: ['🖱️ 마우스', '👆 터치', '⌨️ 키보드'], players: '1~4명',
    how: ['과녁 위에서 누른 채 기다리면 조준점의 흔들림이 점점 줄어요.', '노리는 곳에 올 때 놓으면 던져져요. 너무 오래 쥐면 다시 흔들려요.', '키보드: ← ↑ ↓ → 조준, 스페이스를 길게 눌렀다 떼기.'],
    url: BASE + 'dorm-darts/', repo: 'https://github.com/Sunlitkoreakorea/dorm-darts', art: artDarts,
  },
  {
    id: 'hand-tennis', emoji: '🎾', name: '손 테니스', sub: '웹캠으로 치는 테니스 · vs CPU',

/* ===== 그림 (SVG) ===== */
function artBowling() {
  const pin = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})"><ellipse cx="0" cy="1.5" rx="9" ry="3" fill="rgba(0,0,0,.2)"/><path d="M-5 0 C-9.5 -6 -9.5 -14 -3.5 -24 C-5.6 -27 -4.6 -35 0 -35 C4.6 -35 5.6 -27 3.5 -24 C9.5 -14 9.5 -6 5 0 Z" fill="#fff" stroke="#bccbd9" stroke-width="1"/><path d="M-3.9 -25.6 L3.9 -25.6 L4.1 -23.3 L-4.1 -23.3 Z" fill="#ff6a3d"/><path d="M-4.4 -21.8 L4.4 -21.8 L4.6 -19.6 L-4.6 -19.6 Z" fill="#ff6a3d"/></g>`;
  let pins = '';
  [[4, 82, 28], [3, 94, 28], [2, 106, 28], [1, 118, 28]].forEach(([n, y, gap], r) => { for (let i = 0; i < n; i++) pins += pin(200 + (i - (n - 1) / 2) * gap * 0.62, y, 0.95 + r * 0.1); });
  let boards = ''; for (let i = -3; i <= 3; i++) boards += `<line x1="${200 + i * 8}" y1="62" x2="${200 + i * 52}" y2="244" stroke="rgba(120,80,30,.18)" stroke-width="1.5"/>`;
  return `<svg viewBox="0 0 400 240" role="img" aria-label="볼링 레인과 핀 그림" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="bw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd9a6"/><stop offset="1" stop-color="#f0b877"/></linearGradient>
  <linearGradient id="bs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b4c7e"/><stop offset="1" stop-color="#6ab8e8"/></linearGradient>
  <radialGradient id="bb" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#6fd2ff"/><stop offset=".55" stop-color="#1f86c4"/><stop offset="1" stop-color="#0f4a7a"/></radialGradient></defs>
  <rect width="400" height="240" fill="url(#bs)"/>
  <rect x="0" y="0" width="400" height="64" fill="#13243a"/>
  <g fill="#ffc93c" opacity=".9"><circle cx="40" cy="22" r="4"/><circle cx="90" cy="38" r="3"/><circle cx="318" cy="26" r="4"/><circle cx="362" cy="44" r="3"/></g>
  <polygon points="150,62 250,62 392,240 8,240" fill="#3a3f52"/>
  <polygon points="168,62 232,62 346,240 54,240" fill="url(#bw)"/>${boards}
  <polygon points="160,62 168,62 54,240 22,240" fill="#59657d"/><polygon points="240,62 232,62 346,240 378,240" fill="#59657d"/>
  <g fill="#ff6a3d"><circle cx="200" cy="150" r="2.2"/><circle cx="188" cy="166" r="2.2"/><circle cx="212" cy="166" r="2.2"/></g>
  ${pins}
  <ellipse cx="200" cy="226" rx="46" ry="9" fill="rgba(0,0,0,.28)"/>
  <circle cx="200" cy="196" r="34" fill="url(#bb)"/>
  <g fill="#0b2a46"><circle cx="190" cy="184" r="4.4"/><circle cx="205" cy="180" r="4.4"/><circle cx="198" cy="196" r="4.4"/></g>
  <ellipse cx="186" cy="176" rx="9" ry="5" fill="#fff" opacity=".35" transform="rotate(-30 186 176)"/>
  <g stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".6"><line x1="146" y1="206" x2="130" y2="212"/><line x1="254" y1="206" x2="270" y2="212"/><line x1="152" y1="222" x2="138" y2="230"/></g>
  </svg>`;
}

function artDarts() {
  const cx = 200, cy = 118, P = (r, a) => [cx + r * Math.sin(a), cy - r * Math.cos(a)];
  const wedge = (r0, r1, a0, a1, fill) => { const [x0, y0] = P(r1, a0), [x1, y1] = P(r1, a1), [x2, y2] = P(r0, a1), [x3, y3] = P(r0, a0); return `<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${r1} ${r1} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)} L${x2.toFixed(1)} ${y2.toFixed(1)} A${r0} ${r0} 0 0 0 ${x3.toFixed(1)} ${y3.toFixed(1)} Z" fill="${fill}"/>`; };
  let w = '';
  for (let i = 0; i < 20; i++) {
    const a0 = (i * 18 - 9) * Math.PI / 180, a1 = (i * 18 + 9) * Math.PI / 180, even = i % 2 === 0;
    const single = even ? '#1b2433' : '#f4e9cf', multi = even ? '#e2483d' : '#2f9e6b';
    w += wedge(17, 60, a0, a1, single) + wedge(60, 67, a0, a1, multi) + wedge(67, 93, a0, a1, single) + wedge(93, 100, a0, a1, multi);
  }
  return `<svg viewBox="0 0 400 240" role="img" aria-label="다트판과 다트 그림" xmlns="http://www.w3.org/2000/svg">
  <defs><radialGradient id="dg" cx=".5" cy=".5" r=".7"><stop offset="0" stop-color="#27506f"/><stop offset="1" stop-color="#0d2238"/></radialGradient></defs>
  <rect width="400" height="240" fill="url(#dg)"/>
  <g fill="#ffc93c" opacity=".8"><circle cx="38" cy="30" r="3"/><circle cx="360" cy="40" r="4"/><circle cx="52" cy="200" r="3"/><circle cx="352" cy="196" r="3"/></g>
  <circle cx="${cx}" cy="${cy}" r="110" fill="#0a1522"/><circle cx="${cx}" cy="${cy}" r="108" fill="#1b2433" stroke="#33465e" stroke-width="2"/>
  ${w}
  <circle cx="${cx}" cy="${cy}" r="17" fill="#2f9e6b"/><circle cx="${cx}" cy="${cy}" r="7.5" fill="#e2483d"/>
  <g fill="none" stroke="#a9b8c8" stroke-width=".8" opacity=".7"><circle cx="${cx}" cy="${cy}" r="100"/><circle cx="${cx}" cy="${cy}" r="93"/><circle cx="${cx}" cy="${cy}" r="67"/><circle cx="${cx}" cy="${cy}" r="60"/><circle cx="${cx}" cy="${cy}" r="17"/></g>
  <g transform="translate(${cx + 4} ${cy - 62}) rotate(38)">
    <ellipse cx="22" cy="14" rx="30" ry="5" fill="rgba(0,0,0,.25)" transform="rotate(-2)"/>
    <path d="M0 0 L9 -1.6 L9 1.6 Z" fill="#cfd6de"/><rect x="9" y="-3.2" width="30" height="6.4" rx="3" fill="#d9a62c"/><g stroke="#8a6a14" stroke-width="1"><line x1="15" y1="-3" x2="15" y2="3"/><line x1="21" y1="-3" x2="21" y2="3"/><line x1="27" y1="-3" x2="27" y2="3"/><line x1="33" y1="-3" x2="33" y2="3"/></g>
    <rect x="39" y="-1.8" width="14" height="3.6" fill="#2b2f3a"/><path d="M52 0 L68 -12 L76 -9 L66 0 L76 9 L68 12 Z" fill="#ff6a3d"/><path d="M52 0 L68 -12 L76 -9 L66 0 Z" fill="#ff8f6a"/>
  </g>
  <g transform="translate(${cx - 38} ${cy + 20}) rotate(-32)"><path d="M0 0 L9 -1.6 L9 1.6 Z" fill="#cfd6de"/><rect x="9" y="-3.2" width="26" height="6.4" rx="3" fill="#d9a62c"/><rect x="35" y="-1.8" width="12" height="3.6" fill="#2b2f3a"/><path d="M46 0 L60 -10 L67 -8 L58 0 L67 8 L60 10 Z" fill="#27b5f2"/></g>
  </svg>`;
}

function artTennis() {
  const hw = y => 70 + (y - 60) / 190 * 105, L = (y, f) => 200 + f * hw(y);
  const line = (y1, f1, y2, f2) => `<line x1="${L(y1, f1).toFixed(1)}" y1="${y1}" x2="${L(y2, f2).toFixed(1)}" y2="${y2}"/>`;
  const netY = 128, nh = 18, nhw = hw(netY) + 8;
  let mesh = ''; for (let i = -10; i <= 10; i++) mesh += `<line x1="${(200 + i * nhw / 10).toFixed(1)}" y1="${netY - nh}" x2="${(200 + i * nhw / 10).toFixed(1)}" y2="${netY}"/>`;
  for (let j = 1; j < 4; j++) mesh += `<line x1="${(200 - nhw).toFixed(1)}" y1="${netY - nh + j * nh / 4}" x2="${(200 + nhw).toFixed(1)}" y2="${netY - nh + j * nh / 4}"/>`;
  return `<svg viewBox="0 0 400 240" role="img" aria-label="테니스 코트와 공, 라켓 그림" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="ts" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#46a5e6"/><stop offset="1" stop-color="#dff1fb"/></linearGradient>
  <radialGradient id="tb" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#f1ff7a"/><stop offset=".6" stop-color="#d8f23a"/><stop offset="1" stop-color="#a9c21b"/></radialGradient></defs>
  <rect width="400" height="240" fill="url(#ts)"/>
  <path d="M0 62 L400 62 L400 240 L0 240 Z" fill="#4d9a63"/>
  <g fill="#1f6d68"><rect x="0" y="48" width="400" height="14"/></g>
  <g fill="#ffc93c"><circle cx="30" cy="40" r="4"/><circle cx="70" cy="42" r="4" fill="#ff6a3d"/><circle cx="130" cy="40" r="4" fill="#fff"/><circle cx="260" cy="40" r="4" fill="#fff"/><circle cx="330" cy="42" r="4" fill="#27b5f2"/><circle cx="370" cy="40" r="4"/></g>
  <polygon points="${L(60, -1.45)},60 ${L(60, 1.45)},60 ${L(250, 1.45)},250 ${L(250, -1.45)},250" fill="#2d6db4"/>
  <polygon points="${L(60, -1)},60 ${L(60, 1)},60 ${L(250, 1)},250 ${L(250, -1)},250" fill="#3b84d2"/>
  <g stroke="#fff" stroke-width="2" fill="none">${line(60, -1, 250, -1)}${line(60, 1, 250, 1)}${line(60, -1, 60, 1)}${line(250, -1, 250, 1)}${line(100, -0.78, 100, 0.78)}${line(180, -0.78, 180, 0.78)}${line(100, 0, 180, 0)}</g>
  <g stroke="rgba(13,24,40,.7)" stroke-width="1">${mesh}</g>
  <rect x="${(200 - nhw).toFixed(1)}" y="${netY - nh - 2}" width="${(2 * nhw).toFixed(1)}" height="3.5" fill="#fff"/>
  <ellipse cx="262" cy="196" rx="14" ry="4.5" fill="rgba(13,34,56,.35)"/>
  <circle cx="262" cy="150" r="17" fill="url(#tb)"/>
  <path d="M248 140 C257 148 257 158 248 166" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><path d="M276 140 C267 148 267 158 276 166" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
  <g stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".7"><line x1="232" y1="130" x2="214" y2="120"/><line x1="226" y1="146" x2="206" y2="142"/></g>
  <g transform="translate(70 214) rotate(-38)">
    <rect x="-5" y="0" width="10" height="46" rx="4" fill="#1b2433"/><rect x="-3" y="-6" width="6" height="10" fill="#2b3a52"/>
    <ellipse cx="0" cy="-42" rx="28" ry="37" fill="rgba(255,255,255,.28)" stroke="#ff6a3d" stroke-width="6"/>
    <g stroke="rgba(255,255,255,.7)" stroke-width="1"><line x1="-22" y1="-60" x2="22" y2="-60"/><line x1="-27" y1="-48" x2="27" y2="-48"/><line x1="-27" y1="-36" x2="27" y2="-36"/><line x1="-24" y1="-24" x2="24" y2="-24"/><line x1="-12" y1="-77" x2="-12" y2="-8"/><line x1="0" y1="-79" x2="0" y2="-5"/><line x1="12" y1="-77" x2="12" y2="-8"/></g>
  </g>
  </svg>`;
}

/* ===== 메뉴 ===== */
const $ = id => document.getElementById(id);
const listEl = $('list'), detailEl = $('detail');
let current = 0;

function renderList() {
  listEl.innerHTML = '';
  GAMES.forEach((g, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<button class="item" type="button" data-i="${i}" aria-pressed="${i === current}"><span class="em" aria-hidden="true">${g.emoji}</span><span><b>${g.name}</b><small>${g.sub}</small></span><span class="go" aria-hidden="true">▶</span></button>`;
    listEl.appendChild(li);
  });
  const more = document.createElement('li'); more.className = 'soon'; more.textContent = '새 게임이 생기면 여기에 쌓여요'; listEl.appendChild(more);
}

function renderDetail() {
  const g = GAMES[current];
  detailEl.style.animation = 'none'; void detailEl.offsetWidth; detailEl.style.animation = '';
  detailEl.innerHTML = `<div class="art">${g.art()}</div>
  <div class="dbody"><h2>${g.name}</h2><p class="tagline">${g.tagline}</p><p class="blurb">${g.blurb}</p>
  <ul class="chips">${g.inputs.map(t => `<li>${t}</li>`).join('')}<li class="pl">👥 ${g.players}</li></ul>
  <ul class="how">${g.how.map(t => `<li>${t}</li>`).join('')}</ul>
  <div class="actions"><button class="btn primary" type="button" id="play">▶ 플레이</button><a class="btn" href="${g.url}" target="_blank" rel="noopener">새 탭에서 열기 ↗</a><a class="minor" href="${g.repo}" target="_blank" rel="noopener">소스 보기</a></div></div>`;
  $('play').addEventListener('click', () => go(g.id));
  listEl.querySelectorAll('.item').forEach((b, i) => b.setAttribute('aria-pressed', String(i === current)));
}

function select(i) { current = (i + GAMES.length) % GAMES.length; renderDetail(); }
listEl.addEventListener('click', e => { const b = e.target.closest('.item'); if (b) select(+b.dataset.i); });

/* ===== 플레이 화면 ===== */
const player = $('player'), frame = $('gf'), loading = $('loading');
let hintTimer = 0;

function go(id) { location.hash = '#play/' + id; }
function openPlayer(g) {
  $('ptitle').textContent = g.name; $('newtab').href = g.url; $('loadlink').href = g.url;
  loading.classList.remove('done'); $('loadhint').classList.remove('show');
  clearTimeout(hintTimer); hintTimer = setTimeout(() => $('loadhint').classList.add('show'), 7000);
  frame.title = g.name; frame.src = g.url;
  player.hidden = false; document.body.style.overflow = 'hidden'; document.title = g.name + ' — 미니게임 오락실';
}
function closePlayer() {
  clearTimeout(hintTimer); player.hidden = true; frame.src = 'about:blank'; document.body.style.overflow = '';
  document.title = '미니게임 오락실 — 기숙사 볼링 · 다트 · 손 테니스';
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
}
frame.addEventListener('load', () => {
  if (frame.src === 'about:blank' || !frame.getAttribute('src')) return;
  clearTimeout(hintTimer); loading.classList.add('done'); try { frame.focus(); } catch (_) { /* 무시 */ }
});
$('back').addEventListener('click', () => { if (location.hash.startsWith('#play/')) history.length > 1 ? history.back() : (location.hash = ''); else closePlayer(); });
$('full').addEventListener('click', () => {
  const el = player;
  if (document.fullscreenElement) document.exitFullscreen(); else if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
});

function route() {
  const m = location.hash.match(/^#play\/([\w-]+)$/), g = m && GAMES.find(x => x.id === m[1]);
  if (g) { current = GAMES.indexOf(g); renderList(); renderDetail(); openPlayer(g); } else closePlayer();
}
addEventListener('hashchange', route);

addEventListener('keydown', e => {
  const t = e.target;
  if (!player.hidden || (t && t.closest && t.closest('a, input, textarea'))) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { e.preventDefault(); select(current + 1); }
  else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { e.preventDefault(); select(current - 1); }
  else if (e.key === 'Enter' && !(t && t.closest && t.closest('button'))) { e.preventDefault(); go(GAMES[current].id); }
});

renderList(); renderDetail(); route();
</script>
</body>
</html>
